# Checks every pull request against the rules in README.md (scripts/check.py) and runs the
# checker's own tests. Seconds, standard-library Python only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check models
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checker tests
        run: python3 -m unittest discover -s scripts -v
      - name: Check the repository
        run: python3 scripts/check.py
